<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cozy Infinite Games</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: #000; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* --- TOP HEADER --- */
        #top-header {
            height: 50px;
            background: #0f0f0f;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            color: white;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            user-select: none;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #4CAF50;
            border-radius: 50%;
        }

        #game-title {
            font-weight: bold;
            font-size: 16px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
            color: #888;
            font-size: 14px;
        }

        #refresh-btn {
            font-size: 20px;
            cursor: pointer;
            transition: color 0.2s;
        }
        
        #refresh-btn:active {
            color: #fff;
        }

        /* --- GAME CONTAINER --- */
        #game-container {
            flex: 1; /* Mengambil ruang baki di tengah */
            position: relative;
            overflow: hidden;
            background: #111;
        }

        /* Wrapper untuk menggerakkan 3 frame serentak */
        #frame-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            will-change: transform;
        }

        /* Kelas asas untuk iframe */
        .game-frame {
            position: absolute;
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block; 
            background: #111; 
        }

        /* --- KAWASAN SWIPE TAMBAHAN (Di atas Bottom UI) --- */
        #swipe-extension {
            position: absolute;
            bottom: 65px; /* Sama dengan tinggi bottom-nav */
            left: 0;
            width: 100%;
            height: 60px; /* Masuk 60px ke dalam kawasan game */
            z-index: 15;
            touch-action: none;
        }

        /* --- TUTORIAL OVERLAY (First time user) --- */
        #tutorial-overlay {
            position: absolute;
            bottom: 135px; /* Di atas kawasan swipe */
            width: 100%;
            display: none; /* Disembunyikan secara lalai, JS akan buka jika first time */
            justify-content: center;
            z-index: 20;
            pointer-events: none; /* Supaya tak halang touch */
            animation: bounce 1.5s infinite;
        }

        .tut-box {
            background: rgba(0, 0, 0, 0.8);
            color: #00e5ff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #00e5ff;
            box-shadow: 0 4px 10px rgba(0, 229, 255, 0.3);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* --- BOTTOM UI NAVIGATION --- */
        #bottom-nav {
            height: 65px;
            background: #121212;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
            border-top: 1px solid #222;
            touch-action: none; 
            user-select: none;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 11px;
            gap: 4px;
            cursor: pointer;
            width: 25%;
        }

        .nav-item.active {
            color: #00e5ff;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
        }

    </style>
</head>
<body>

    <!-- Header Atas -->
    <div id="top-header">
        <div class="header-left">
            <div class="status-dot"></div>
            <span id="game-title">Loading...</span>
        </div>
        <div class="header-right">
            <span id="game-counter">0/0</span>
            <span id="refresh-btn">↻</span>
        </div>
    </div>

    <!-- Ruang Main Game -->
    <div id="game-container">
        <!-- Pembungkus 3-Iframe untuk Preload -->
        <div id="frame-wrapper">
            <iframe class="game-frame" id="frame-prev" allowfullscreen></iframe>
            <iframe class="game-frame" id="frame-curr" allowfullscreen></iframe>
            <iframe class="game-frame" id="frame-next" allowfullscreen></iframe>
        </div>
    </div>

    <!-- Tutorial untuk pengguna kali pertama -->
    <div id="tutorial-overlay">
        <div class="tut-box">↕ Swipe up or down here to change games</div>
    </div>

    <!-- Kawasan swipe yang lutsinar lebih tinggi sedikit masuk ke webview -->
    <div id="swipe-extension"></div>

    <!-- UI Bawah -->
    <nav id="bottom-nav">
        <div class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="6" width="20" height="12" rx="2" ry="2"></rect>
                <path d="M6 12h4"></path>
                <path d="M8 10v4"></path>
                <line x1="15" y1="13" x2="15.01" y2="13"></line>
                <line x1="18" y1="11" x2="18.01" y2="11"></line>
            </svg>
            <span>Game</span>
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            <span>All Games</span>
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span>Search</span>
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Profile</span>
        </div>
    </nav>

    <script>
        const games = [
            { title: "Cute Animal", url: "https://arisuamanz.github.io/CuteAnimal/" },
            { title: "Stack", url: "https://arisuamanz.github.io/Stack/" },
            { title: "Painting Circuit", url: "https://arisuamanz.github.io/Painting-circuit-/" },
            { title: "3D Run Surfer", url: "https://arisuamanz.github.io/3DRunsurfer/" },
            { title: "Tower Build", url: "https://arisuamanz.github.io/Towerbuild/" },
            { title: "Solar Smash", url: "https://arisuamanz.github.io/Solar-Smash/" },
            { title: "Light Down", url: "https://arisuamanz.github.io/Light-Down/" }
        ];

        let index = 0;
        
        const wrapper = document.getElementById('frame-wrapper');
        const bottomNav = document.getElementById('bottom-nav');
        const swipeExt = document.getElementById('swipe-extension');
        const tutorialOverlay = document.getElementById('tutorial-overlay');
        const titleEl = document.getElementById('game-title');
        const counterEl = document.getElementById('game-counter');
        const refreshBtn = document.getElementById('refresh-btn');

        let frames = {
            prev: document.getElementById('frame-prev'),
            curr: document.getElementById('frame-curr'),
            next: document.getElementById('frame-next')
        };

        // --- SISTEM TUTORIAL LOCAL STORAGE ---
        function checkTutorial() {
            const hasSeenTutorial = localStorage.getItem('cozyGameTutorialCompleted');
            if (!hasSeenTutorial) {
                tutorialOverlay.style.display = 'flex';
            }
        }
        
        function hideTutorial() {
            if (tutorialOverlay.style.display !== 'none') {
                tutorialOverlay.style.display = 'none';
                localStorage.setItem('cozyGameTutorialCompleted', 'true');
            }
        }

        // --- FUNGSI IKLAN UNITY ---
        const showUnityAds = () => {
            const message = "ShowUnityAds";
            try {
                if (window.Unity && typeof window.Unity.call === "function") {
                    window.Unity.call(message); return;
                }
                if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.unityControl) {
                    window.webkit.messageHandlers.unityControl.postMessage(message); return;
                }
                if (window.location && typeof window.location.href === "string") {
                    window.location.href = `unity:${encodeURIComponent(message)}`; return;
                }
            } catch (error) { console.warn("showUnityAds bridge error:", error); }
            console.log("Ad Signal: ShowUnityAds dipanggil dari web.");
        };

        function updateHeaderUI() {
            titleEl.innerText = games[index].title;
            counterEl.innerText = `${index + 1}/${games.length}`;
        }

        window.onload = () => {
            const total = games.length;
            
            frames.prev.style.top = '-100%';
            frames.curr.style.top = '0%';
            frames.next.style.top = '100%';

            frames.curr.src = games[index].url;
            frames.next.src = games[(index + 1) % total].url;
            frames.prev.src = games[(index - 1 + total) % total].url;

            updateHeaderUI();
            checkTutorial(); // Panggil cek tutorial masa loading
        };

        refreshBtn.onclick = () => {
            frames.curr.src = games[index].url; 
        };

        // --- FIZIKAL SMOOTH DRAG ---
        let startY = 0;
        let currentY = 0;
        let isDragging = false;
        let isAnimating = false; 
        const SWIPE_THRESHOLD = 50; 

        // Fungsi untuk menguruskan sentuhan
        function handleTouchStart(e) {
            if (isAnimating) return;
            startY = e.touches[0].clientY;
            currentY = startY;
            isDragging = true;
            wrapper.style.transition = 'none';
        }

        function handleTouchMove(e) {
            if (!isDragging || isAnimating) return;
            e.preventDefault(); 
            currentY = e.touches[0].clientY;
            const diffY = currentY - startY;
            wrapper.style.transform = `translateY(${diffY}px)`;
        }

        function handleTouchEnd(e) {
            if (!isDragging || isAnimating) return;
            isDragging = false;
            const diffY = currentY - startY;

            if (diffY < -SWIPE_THRESHOLD) {
                isAnimating = true;
                wrapper.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)';
                wrapper.style.transform = `translateY(-100%)`;
                hideTutorial(); // Sorok tutorial bila berjaya swipe
                setTimeout(() => anjakFrameKitaran(1), 400); 
            } 
            else if (diffY > SWIPE_THRESHOLD) {
                isAnimating = true;
                wrapper.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)';
                wrapper.style.transform = `translateY(100%)`;
                hideTutorial(); // Sorok tutorial bila berjaya swipe
                setTimeout(() => anjakFrameKitaran(-1), 400);
            } 
            else {
                wrapper.style.transition = 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)';
                wrapper.style.transform = `translateY(0)`;
            }
        }

        // Pasang event listener kepada Bottom Nav DAN Kawasan Tambahan (Swipe Extension)
        [bottomNav, swipeExt].forEach(el => {
            el.addEventListener('touchstart', handleTouchStart);
            el.addEventListener('touchmove', handleTouchMove, { passive: false });
            el.addEventListener('touchend', handleTouchEnd);
        });

        function anjakFrameKitaran(dir) {
            const total = games.length;
            
            wrapper.style.transition = 'none';
            wrapper.style.transform = `translateY(0)`;

            if (dir > 0) {
                index = (index + 1) % total;
                
                let tempPrev = frames.prev;
                frames.prev = frames.curr;
                frames.curr = frames.next;
                frames.next = tempPrev;

                frames.next.src = games[(index + 1) % total].url;
            } 
            else {
                index = (index - 1 + total) % total;
                
                let tempNext = frames.next;
                frames.next = frames.curr;
                frames.curr = frames.prev;
                frames.prev = tempNext;

                frames.prev.src = games[(index - 1 + total) % total].url;
            }

            frames.prev.style.top = '-100%';
            frames.curr.style.top = '0%';
            frames.next.style.top = '100%';

            updateHeaderUI();
            isAnimating = false; 
        }

    </script>
</body>
</html>
