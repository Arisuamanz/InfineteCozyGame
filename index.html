<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cozy Infinite Games</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: #000; /* Latar belakang hitam supaya nampak kemas masa swipe */
            touch-action: none; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Container utama */
        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        /* Pembungkus (Wrapper) yang akan ditarik oleh jari dan diluncurkan */
        #swipe-wrapper {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            will-change: transform; /* Hardware Acceleration untuk 60FPS */
        }

        #game-iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block; 
            background: #111; 
        }

        /* TikTok Style Overlay */
        #tiktok-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.1) 60%, rgba(0,0,0,0.9) 100%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            color: white;
            user-select: none;
        }

        /* Swipe Hint in the center */
        .swipe-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            opacity: 0.8;
            animation: pulse 2s infinite;
            pointer-events: none;
            transition: opacity 0.4s ease; /* Transisi untuk hilangkan hint */
        }
        
        .swipe-hint .icon { font-size: 40px; margin-bottom: 8px; display: block; }
        .swipe-hint p { margin: 0; font-size: 16px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }

        /* Game Info Bottom Left */
        .game-info {
            padding: 20px;
            padding-bottom: 40px;
            pointer-events: none;
        }

        .game-info h2 {
            margin: 0 0 8px 0;
            font-size: 26px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }

        .game-info p {
            margin: 0;
            font-size: 15px;
            opacity: 0.9;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .play-badge {
            background: #ff0050; /* TikTok Pinkish/Red */
            padding: 5px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 2px 5px rgba(255, 0, 80, 0.4);
        }

        /* Menu Button (Top left) - Kedudukan top 100px */
        #menu-btn {
            position: absolute;
            top: 100px; 
            left: 15px;
            background-color: rgba(0,0,0,0.7); 
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.3);
            padding: 8px 16px; 
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px; 
            z-index: 20;
            display: none;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            align-items: center;
            gap: 6px;
            transition: all 1s ease; 
        }

        /* Teks dengan efek gradient liplap */
        .text-gradient {
            background: linear-gradient(90deg, #ffffff 0%, #555555 50%, #ffffff 100%);
            background-size: 200% auto;
            color: #fff;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShine 1.5s linear infinite;
        }

        /* Transparent penuh selepas 5 saat */
        #menu-btn.faded {
            background-color: transparent; 
            border-color: transparent; 
            backdrop-filter: blur(0px); 
            -webkit-backdrop-filter: blur(0px);
            box-shadow: none;
            opacity: 0.4; 
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }
        @keyframes textShine {
            to { background-position: 200% center; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        
        <!-- Menu Button (Terletak di luar wrapper supaya tak ikut di-scroll) -->
        <div id="menu-btn"><span class="text-gradient">☰ Menu</span></div>

        <!-- Pembungkus (Wrapper) yang akan ditarik oleh jari (Fizikal) -->
        <div id="swipe-wrapper">
            <!-- The Game Iframe -->
            <iframe id="game-iframe" src="" allowfullscreen></iframe>

            <!-- TikTok Scroll Overlay -->
            <div id="tiktok-overlay">
                
                <div class="swipe-hint" id="swipe-hint-el">
                    <span class="icon">↕</span>
                    <p>Swipe Up / Down</p>
                </div>

                <div class="game-info">
                    <h2 id="game-title">Loading...</h2>
                    <p><span class="play-badge">▶ Tap to Play</span></p>
                </div>

            </div>
        </div>

    </div>

    <script>
        const games = [
            { title: "Cute Animal", url: "https://arisuamanz.github.io/CuteAnimal/" },
            { title: "Stack", url: "https://arisuamanz.github.io/Stack/" },
            { title: "3D Run Surfer", url: "https://arisuamanz.github.io/3DRunsurfer/" },
            { title: "Tower Build", url: "https://arisuamanz.github.io/Towerbuild/" },
            { title: "Forest ASMR Light", url: "https://arisuamanz.github.io/Forest-Asmr-Light-/" },
            { title: "Wordle", url: "https://arisuamanz.github.io/Wordle/" },
            { title: "Guess Number", url: "https://arisuamanz.github.io/Guess-number-/" },
            { title: "Yandere Girlfriend", url: "https://arisuamanz.github.io/Yandare-girlfriend-/" },
            { title: "Coming Soon", url: "https://arisuamanz.github.io/Coming-Soon/" },
            { title: "Lonely Dictator", url: "https://arisuamanz.github.io/Lonely-Dictator-/" }
        ];

        let index = 0;
        let playCounter = 0; 
        let fadeTimeout; 
        let hasSwiped = false; 
        
        const swipeWrapper = document.getElementById('swipe-wrapper');
        const iframe = document.getElementById('game-iframe');
        const overlay = document.getElementById('tiktok-overlay');
        const menuBtn = document.getElementById('menu-btn');
        const titleEl = document.getElementById('game-title');
        const swipeHintEl = document.getElementById('swipe-hint-el');

        // Initial Load Game 1
        window.onload = () => {
            iframe.src = games[index].url;
            titleEl.innerText = games[index].title;
        };

        const showUnityAds = () => {
            const message = "ShowUnityAds";
            try {
                if (window.Unity && typeof window.Unity.call === "function") {
                    window.Unity.call(message); return;
                }
                if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.unityControl) {
                    window.webkit.messageHandlers.unityControl.postMessage(message); return;
                }
                if (window.location && typeof window.location.href === "string") {
                    window.location.href = `unity:${encodeURIComponent(message)}`; return;
                }
            } catch (error) { console.warn("showUnityAds bridge error:", error); }
            console.log("Isyarat Iklan: ShowUnityAds dipanggil dari web.");
        };

        // --- FIZIKAL SMOOTH DRAG LENGKAP (TOUCHMOVE) ---
        let startY = 0;
        let currentY = 0;
        let isDragging = false;
        const SWIPE_THRESHOLD = 80; // Jarak minimum untuk tukar game

        overlay.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
            currentY = startY;
            isDragging = true;
            
            // Buang transition supaya wrapper ikut jari 1:1 tanpa lengah
            swipeWrapper.style.transition = 'none';
        });

        overlay.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            e.preventDefault(); // Elak browser scroll lalai
            
            currentY = e.touches[0].clientY;
            const diffY = currentY - startY;
            
            // Gerakkan wrapper berserta Iframe ikut jari
            swipeWrapper.style.transform = `translateY(${diffY}px)`;
        }, { passive: false });

        overlay.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            isDragging = false;
            const diffY = currentY - startY;
            
            // Hilangkan hint scroll jika pengguna dah scroll
            if (Math.abs(diffY) > 20 && !hasSwiped) {
                hasSwiped = true;
                swipeHintEl.style.opacity = '0';
                setTimeout(() => swipeHintEl.style.display = 'none', 400);
            }

            // Tambah efek lantunan (cubic-bezier) untuk animasi pelepasan jari
            swipeWrapper.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)';

            if (diffY < -SWIPE_THRESHOLD) {
                // Swipe Atas - Luncur laju ke atas skrin
                swipeWrapper.style.transform = `translateY(-100vh)`;
                setTimeout(() => ubahGameLatarBelakang(1), 400); 
            } 
            else if (diffY > SWIPE_THRESHOLD) {
                // Swipe Bawah - Luncur laju ke bawah skrin
                swipeWrapper.style.transform = `translateY(100vh)`;
                setTimeout(() => ubahGameLatarBelakang(-1), 400);
            } 
            else {
                // Sentuhan kecil / Batal Swipe -> Melantun semula ke tengah
                swipeWrapper.style.transform = `translateY(0)`;
                if (Math.abs(diffY) < 10) {
                    playGame(); // Tap to play
                }
            }
        });

        // --- PENUKARAN GAME DI LATAR BELAKANG ---
        function ubahGameLatarBelakang(dir) {
            // Update Index
            index = (index + dir + games.length) % games.length;
            
            // 1. Matikan transisi & Pindah kedudukan wrapper ke arah bertentangan SECARA SERTA MERTA
            swipeWrapper.style.transition = 'none';
            if (dir > 0) {
                // Jika tadi kita swipe naik, game baru perlu muncul dari BAWAH (100vh)
                swipeWrapper.style.transform = `translateY(100vh)`;
            } else {
                // Jika tadi kita swipe turun, game baru perlu muncul dari ATAS (-100vh)
                swipeWrapper.style.transform = `translateY(-100vh)`;
            }

            // 2. Tukar Game & Title masa ia duduk luar skrin (Elak flickering putih nampak depan mata)
            iframe.src = games[index].url;
            titleEl.innerText = games[index].title;

            // 3. Pasang balik animasi Cubic Bezier & luncurkan perlahan-lahan ke tengah (0)
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    swipeWrapper.style.transition = 'transform 0.5s cubic-bezier(0.25, 1, 0.5, 1)';
                    swipeWrapper.style.transform = `translateY(0)`;
                });
            });
        }

        // --- PLAY GAME ---
        function playGame() {
            playCounter++; 
            if (playCounter >= 2) {
                showUnityAds(); 
                playCounter = 0; 
            }

            overlay.style.display = 'none';
            
            menuBtn.style.display = 'flex';
            menuBtn.classList.remove('faded');
            clearTimeout(fadeTimeout);

            // Selepas 5 saat butang menu jadi transparent penuh
            fadeTimeout = setTimeout(() => {
                menuBtn.classList.add('faded');
            }, 5000);
        }

        // --- BUTTON MENU ---
        menuBtn.onclick = () => {
            menuBtn.style.display = 'none';
            overlay.style.display = 'flex';
            clearTimeout(fadeTimeout); 
        };

    </script>
</body>
</html>
