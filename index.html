<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cozy Infinite Games</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: #000; 
            touch-action: none; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Container for the game */
        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        #game-iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block; 
            background: #111; 
        }

        /* TikTok Style Overlay */
        #tiktok-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.1) 60%, rgba(0,0,0,0.8) 100%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            color: white;
            user-select: none;
        }

        /* Swipe Hint in the center */
        .swipe-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            opacity: 0.7;
            animation: pulse 2s infinite;
            pointer-events: none;
        }
        
        .swipe-hint .icon { font-size: 40px; margin-bottom: 8px; display: block; }
        .swipe-hint p { margin: 0; font-size: 16px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }

        /* Game Info Bottom Left */
        .game-info {
            padding: 20px;
            padding-bottom: 40px;
            padding-right: 80px; /* Space for right actions */
            pointer-events: none;
        }

        .game-info h2 {
            margin: 0 0 8px 0;
            font-size: 24px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .game-info p {
            margin: 0;
            font-size: 15px;
            opacity: 0.9;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .play-badge {
            background: #ff0050; /* TikTok Pinkish/Red */
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        /* Right Action Column (Aesthetic like TikTok) */
        .right-actions {
            position: absolute;
            right: 15px;
            bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            pointer-events: none;
        }

        .action-icon {
            width: 45px;
            height: 45px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            border: 2px solid rgba(255,255,255,0.8);
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* Menu Button (Shown when playing) - Updated to be smaller and top left */
        #menu-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 6px 12px; /* Smaller padding */
            border-radius: 15px; /* Slightly smaller radius */
            font-weight: bold;
            font-size: 12px; /* Smaller font */
            z-index: 20;
            display: none;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            align-items: center;
            gap: 4px;
        }

        /* Scroll Animations */
        @keyframes slideUpIn {
            0% { transform: translateY(100%); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes slideDownIn {
            0% { transform: translateY(-100%); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        .animate-up { animation: slideUpIn 0.35s ease-out forwards; }
        .animate-down { animation: slideDownIn 0.35s ease-out forwards; }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- The Game Iframe -->
        <iframe id="game-iframe" src="" allowfullscreen></iframe>

        <!-- Menu Button (Visible during gameplay) -->
        <div id="menu-btn">☰ Menu</div>

        <!-- TikTok Scroll Overlay -->
        <div id="tiktok-overlay">
            
            <div class="swipe-hint">
                <span class="icon">↕</span>
                <p>Swipe Up / Down</p>
            </div>

            <div class="right-actions">
                <div class="action-icon">🎮</div>
                <div class="action-icon" style="font-size: 16px;">🔥</div>
            </div>

            <div class="game-info">
                <h2 id="game-title">Loading...</h2>
                <p><span class="play-badge">▶ Tap to Play</span></p>
            </div>

        </div>
    </div>

    <script>
        // Game list with assigned titles
        const games = [
            { title: "Stack", url: "https://arisuamanz.github.io/Stack/" },
            { title: "Cute Animal", url: "https://arisuamanz.github.io/CuteAnimal/" },
            { title: "3D Run Surfer", url: "https://arisuamanz.github.io/3DRunsurfer/" },
            { title: "Tower Build", url: "https://arisuamanz.github.io/Towerbuild/" },
            { title: "Wordle", url: "https://arisuamanz.github.io/Wordle/" },
            { title: "Guess Number", url: "https://arisuamanz.github.io/Guess-number-/" }
        ];

        let index = 0;
        
        const iframe = document.getElementById('game-iframe');
        const overlay = document.getElementById('tiktok-overlay');
        const menuBtn = document.getElementById('menu-btn');
        const titleEl = document.getElementById('game-title');

        // Initial Load
        window.onload = () => {
            loadGame(0); // Load first game without animation
        };

        // Function to load and animate game change
        const loadGame = (dir) => {
            // Update index
            index = (index + dir + games.length) % games.length;
            
            // Reset animation
            iframe.className = '';
            void iframe.offsetWidth; // Trigger reflow to restart animation

            // Apply direction animation
            if (dir > 0) iframe.className = 'animate-up';
            else if (dir < 0) iframe.className = 'animate-down';

            // Set new source and title
            iframe.src = games[index].url;
            titleEl.innerText = games[index].title;
        };

        // --- TIKTOK SWIPE LOGIC ---
        let startY = 0;
        let endY = 0;
        let isDragging = false;

        // Start touch
        overlay.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
            isDragging = true;
        });

        // End touch
        overlay.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            endY = e.changedTouches[0].clientY;
            isDragging = false;
            
            handleInteraction();
        });

        function handleInteraction() {
            const diffY = startY - endY;
            
            // If swiped more than 50px vertically
            if (Math.abs(diffY) > 50) {
                if (diffY > 0) {
                    // Swiped UP -> Next Game
                    loadGame(1);
                } else {
                    // Swiped DOWN -> Previous Game
                    loadGame(-1);
                }
            } 
            // If movement is very small, treat it as a TAP
            else if (Math.abs(diffY) < 10) {
                playGame();
            }
        }

        // --- PLAY AND MENU TOGGLE ---
        function playGame() {
            // Hide TikTok overlay to allow playing the game
            overlay.style.display = 'none';
            // Show the "Menu" button to return to TikTok mode
            menuBtn.style.display = 'flex';
        }

        menuBtn.onclick = () => {
            // Hide Menu button and show TikTok overlay again
            menuBtn.style.display = 'none';
            overlay.style.display = 'flex';
        };

    </script>
</body>
</html>
