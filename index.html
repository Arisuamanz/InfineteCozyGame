<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cozy Infinite Games</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: #000; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* --- TOP HEADER --- */
        #top-header {
            height: 50px;
            background: #0f0f0f;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            color: white;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            user-select: none;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #4CAF50;
            border-radius: 50%;
        }

        #game-title {
            font-weight: bold;
            font-size: 16px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
            color: #888;
            font-size: 14px;
        }

        #refresh-btn {
            font-size: 20px;
            cursor: pointer;
            transition: color 0.2s;
        }
        
        #refresh-btn:active {
            color: #fff;
        }

        /* --- CONTENT AREA (GAME ATAU AI MAKER) --- */
        #content-area {
            flex: 1; 
            position: relative;
            overflow: hidden;
            background: #111;
        }

        /* --- GAME CONTAINER --- */
        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Secara lalai dipaparkan */
            display: block; 
        }

        /* Wrapper untuk menggerakkan 3 frame serentak */
        #frame-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            will-change: transform;
        }

        /* Kelas asas untuk iframe */
        .game-frame {
            position: absolute;
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block; 
            background: #111; 
        }

        /* --- AI GAME MAKER CONTAINER --- */
        #create-game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Secara lalai disembunyikan */
            display: none; 
            background: #000;
        }

        #create-game-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #111;
        }

        /* --- KAWASAN SWIPE TAMBAHAN (Di atas Bottom UI) --- */
        /* Hanya aktif bila dalam mode Game */
        #swipe-extension {
            position: absolute;
            bottom: 65px; 
            left: 0;
            width: 100%;
            height: 60px; 
            z-index: 15;
            touch-action: none;
        }

        /* --- TUTORIAL OVERLAY (First time user) --- */
        #tutorial-overlay {
            position: absolute;
            bottom: 135px; 
            width: 100%;
            display: none; 
            justify-content: center;
            z-index: 20;
            pointer-events: none; 
            animation: bounce 1.5s infinite;
        }

        .tut-box {
            background: rgba(0, 0, 0, 0.8);
            color: #00e5ff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #00e5ff;
            box-shadow: 0 4px 10px rgba(0, 229, 255, 0.3);
            text-align: center;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* --- BOTTOM UI NAVIGATION --- */
        #bottom-nav {
            height: 65px;
            background: #121212;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 20; /* Pastikan ia berada di atas segala-galanya */
            border-top: 1px solid #222;
            touch-action: none; 
            user-select: none;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 11px;
            gap: 4px;
            cursor: pointer;
            width: 20%;
            transition: color 0.2s;
        }

        .nav-item:active {
            color: #fff;
        }

        .nav-item.active {
            color: #00e5ff;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
        }

        /* Gaya khas untuk butang Create/Tambah apabila aktif */
        #btn-create.active svg {
            stroke: #00e5ff; 
        }

        /* --- SOURCE CODE VIEWER (MODAL) --- */
        /* Modal kod dikekalkan kerana ia adalah "overlay" yang perlu ditutup secara berasingan */
        #code-viewer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1c1c1c;
            z-index: 10000;
            display: none;
            flex-direction: column;
        }

        .cv-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #252525;
            border-bottom: 1px solid #333;
        }

        .cv-title {
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        .cv-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-copy, .btn-close {
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-copy { background-color: #00e5ff; color: #000; }
        .btn-close { background-color: #ff4757; color: white; }

        .cv-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #1e1e1e;
        }

        .cv-content pre {
            color: #dcdcdc;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin: 0;
        }

    </style>
</head>
<body>

    <!-- Header Atas -->
    <div id="top-header">
        <div class="header-left">
            <div class="status-dot"></div>
            <span id="game-title">Loading...</span>
        </div>
        <div class="header-right">
            <span id="refresh-btn">↻</span>
        </div>
    </div>

    <!-- Ruang Kandungan Utama (Bertukar antara Game dan AI Maker) -->
    <div id="content-area">
        
        <!-- Ruang Main Game -->
        <div id="game-container">
            <!-- Pembungkus 3-Iframe untuk Preload -->
            <div id="frame-wrapper">
                <iframe class="game-frame" id="frame-prev" allowfullscreen></iframe>
                <iframe class="game-frame" id="frame-curr" allowfullscreen></iframe>
                <iframe class="game-frame" id="frame-next" allowfullscreen></iframe>
            </div>
        </div>

        <!-- AI GAME MAKER CONTAINER (Tanpa butang close) -->
        <div id="create-game-container">
            <iframe id="create-game-frame" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>

    </div>

    <!-- Tutorial untuk pengguna kali pertama -->
    <div id="tutorial-overlay">
        <div class="tut-box">↕ Swipe up or down at the bottom here to change games</div>
    </div>

    <!-- Kawasan swipe yang lutsinar lebih tinggi sedikit masuk ke webview -->
    <div id="swipe-extension"></div>

    <!-- SOURCE CODE VIEWER UI -->
    <div id="code-viewer">
        <div class="cv-header">
            <span class="cv-title" id="code-viewer-title">Game - Source Code</span>
            <div class="cv-buttons">
                <button class="btn-copy" id="btn-copy">Copy</button>
                <button class="btn-close" id="btn-close-code">Close</button>
            </div>
        </div>
        <div class="cv-content">
            <pre><code id="code-content">Loading source code...</code></pre>
        </div>
    </div>

    <!-- UI Bawah (Kekal Sentiasa Di Bawah) -->
    <nav id="bottom-nav">
        <!-- Butang Game -->
        <div class="nav-item active" id="btn-nav-game">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="6" width="20" height="12" rx="2" ry="2"></rect>
                <path d="M6 12h4"></path>
                <path d="M8 10v4"></path>
                <line x1="15" y1="13" x2="15.01" y2="13"></line>
                <line x1="18" y1="11" x2="18.01" y2="11"></line>
            </svg>
            <span>Game</span>
        </div>
        
        <!-- Butang Previous Game (Arrow Up) -->
        <div class="nav-item" id="btn-prev">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="18 15 12 9 6 15"></polyline>
            </svg>
            <span>Prev</span>
        </div>

        <!-- Butang Create (+ Tengah) -->
        <div class="nav-item" id="btn-create">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>Create</span>
        </div>
        
        <!-- Butang Next Game (Arrow Down) -->
        <div class="nav-item" id="btn-next">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
            <span>Next</span>
        </div>
        
        <!-- Butang Code -->
        <div class="nav-item" id="btn-code">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="16 18 22 12 16 6"></polyline>
                <polyline points="8 6 2 12 8 18"></polyline>
            </svg>
            <span>Code</span>
        </div>
    </nav>

    <script>
        // --- SENARAI GAME ---
        const games = [
            { title: "Stack", url: "https://arisuamanz.github.io/Stack/" },
            { title: "Cute Animal", url: "https://arisuamanz.github.io/CuteAnimal/" },
            { title: "Painting Circuit", url: "https://arisuamanz.github.io/Painting-circuit-/" },
            { title: "Point Light Adventure", url: "https://arisuamanz.github.io/Point-Light-Adventure-/" },
            { title: "3D Run Surfer", url: "https://arisuamanz.github.io/3DRunsurfer/" },
            { title: "Tower Build", url: "https://arisuamanz.github.io/Towerbuild/" },
            { title: "Solar Smash", url: "https://arisuamanz.github.io/Solar-Smash/" },
            { title: "Light Down", url: "https://arisuamanz.github.io/Light-Down/" },
            { title: "Neon Rider", url: "https://arisuamanz.github.io/Neon-Rider/" },
            { title: "Ice Smash Cannon", url: "https://arisuamanz.github.io/Ice-Smash-Cannon/" },
            { title: "Arrow Puzzle", url: "https://arisuamanz.github.io/Arrow-Puzzle/" },
            { title: "Helix Ball", url: "https://arisuamanz.github.io/Helix-Ball/" }
        ];

        let index = 0;
        
        let adPhase = 1; 
        let adSwipeCount = 0; 
        let timerFinished = false; 

        // DOM Elements
        const wrapper = document.getElementById('frame-wrapper');
        const bottomNav = document.getElementById('bottom-nav');
        const swipeExt = document.getElementById('swipe-extension');
        const tutorialOverlay = document.getElementById('tutorial-overlay');
        const titleEl = document.getElementById('game-title');
        const refreshBtn = document.getElementById('refresh-btn');

        // Navigasi & View Containers
        const gameContainer = document.getElementById('game-container');
        const createGameContainer = document.getElementById('create-game-container');
        const createGameFrame = document.getElementById('create-game-frame');

        // Butang Navigasi
        const btnNavGame = document.getElementById('btn-nav-game');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnCreate = document.getElementById('btn-create');
        const btnCode = document.getElementById('btn-code');

        // Elemen Source Code Viewer
        const codeViewer = document.getElementById('code-viewer');
        const codeViewerTitle = document.getElementById('code-viewer-title');
        const codeContent = document.getElementById('code-content');
        const btnCopy = document.getElementById('btn-copy');
        const btnCloseCode = document.getElementById('btn-close-code');
        let currentRawCode = "";

        let frames = {
            prev: document.getElementById('frame-prev'),
            curr: document.getElementById('frame-curr'),
            next: document.getElementById('frame-next')
        };

        function checkTutorial() {
            const hasSeenTutorial = localStorage.getItem('cozyGameTutorialCompleted');
            if (!hasSeenTutorial) {
                tutorialOverlay.style.display = 'flex';
            }
        }
        
        function hideTutorial() {
            if (tutorialOverlay.style.display !== 'none') {
                tutorialOverlay.style.display = 'none';
                localStorage.setItem('cozyGameTutorialCompleted', 'true');
            }
        }

        const showUnityAds = () => {
            const message = "ShowUnityAds";
            try {
                if (window.Unity && typeof window.Unity.call === "function") {
                    window.Unity.call(message); return;
                }
                if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.unityControl) {
                    window.webkit.messageHandlers.unityControl.postMessage(message); return;
                }
                if (window.location && typeof window.location.href === "string") {
                    window.location.href = `unity:${encodeURIComponent(message)}`; return;
                }
            } catch (error) { console.warn("Ralat pautan showUnityAds:", error); }
            console.log("Ad Signal: ShowUnityAds dipanggil dari web.");
        };

        function startAdTimer() {
            timerFinished = false;
            adSwipeCount = 0;
            setTimeout(() => { timerFinished = true; }, 120000); 
        }

        function updateHeaderUI() {
            if (gameContainer.style.display !== 'none') {
                titleEl.innerText = games[index].title;
            } else {
                titleEl.innerText = "AI Game Maker";
            }
        }

        window.onload = () => {
            const savedIndex = localStorage.getItem('cozyLastGameIndex');
            if (savedIndex !== null) {
                let parsedIndex = parseInt(savedIndex, 10);
                if (!isNaN(parsedIndex) && parsedIndex >= 0 && parsedIndex < games.length) {
                    index = parsedIndex;
                }
            }

            const total = games.length;
            
            frames.prev.style.top = '-100%';
            frames.curr.style.top = '0%';
            frames.next.style.top = '100%';

            frames.curr.src = games[index].url;
            frames.next.src = games[(index + 1) % total].url;
            frames.prev.src = games[(index - 1 + total) % total].url;

            updateHeaderUI();
            checkTutorial(); 
        };

        refreshBtn.onclick = () => {
            // Bergantung pada view mana yang sedang aktif
            if (gameContainer.style.display !== 'none') {
                frames.curr.src = games[index].url; 
            } else {
                // Refresh AI Maker
                const currentSrc = createGameFrame.src;
                createGameFrame.src = '';
                setTimeout(() => { createGameFrame.src = currentSrc; }, 50);
            }
        };

        // --- SISTEM PERTUKARAN TAB (NAV BAR) ---
        
        // Tab: Game
        btnNavGame.onclick = () => {
            btnNavGame.classList.add('active');
            btnCreate.classList.remove('active');
            
            createGameContainer.style.display = 'none';
            gameContainer.style.display = 'block';
            swipeExt.style.display = 'block'; // Aktifkan semula kawasan swipe
            
            updateHeaderUI();
        };

        // Tab: Create
        btnCreate.onclick = () => {
            btnCreate.classList.add('active');
            btnNavGame.classList.remove('active');
            
            gameContainer.style.display = 'none';
            createGameContainer.style.display = 'block';
            swipeExt.style.display = 'none'; // Matikan kawasan swipe supaya tak terganggu
            
            updateHeaderUI();

            // Masukkan link jika iframe masih kosong untuk elak reload setiap kali ditekan
            const targetUrl = "https://arisuamanz.github.io/Ai-Game-Maker/";
            if (createGameFrame.src !== targetUrl) {
                createGameFrame.src = targetUrl;
            }
        };

        // --- LOGIK SOURCE CODE VIEWER ---
        btnCode.onclick = () => {
            // Hanya tunjuk kod untuk Game, bukan untuk AI Maker
            if (gameContainer.style.display === 'none') {
                alert("Sila kembali ke tab 'Game' untuk melihat kod sumber permainan.");
                return;
            }

            showUnityAds(); // Panggil Iklan

            codeViewer.style.display = 'flex';
            codeViewerTitle.innerText = `${games[index].title} - Source Code`;
            codeContent.innerText = "Mengambil kod sumber... Sila tunggu sebentar.\n(Fetching source code...)";
            btnCopy.innerText = "Copy";
            currentRawCode = "";

            fetch(games[index].url)
                .then(response => {
                    if (!response.ok) throw new Error("Network response was not ok");
                    return response.text();
                })
                .then(htmlText => {
                    currentRawCode = htmlText;
                    codeContent.textContent = htmlText; 
                })
                .catch(error => {
                    codeContent.innerText = `Gagal mendapatkan kod sumber.\nRalat: ${error.message}\n\nMungkin disebabkan oleh tetapan CORS dari pelayan sumber.`;
                });
        };

        btnCloseCode.onclick = () => {
            codeViewer.style.display = 'none';
        };

        btnCopy.onclick = () => {
            if (!currentRawCode) return;
            
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(currentRawCode).then(() => {
                    btnCopy.innerText = "Copied!";
                    setTimeout(() => btnCopy.innerText = "Copy", 2000);
                }).catch(err => copyFallback(currentRawCode));
            } else {
                copyFallback(currentRawCode);
            }
        };

        function copyFallback(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";  
            textArea.style.left = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                btnCopy.innerText = "Copied!";
            } catch (err) {
                btnCopy.innerText = "Failed";
            }
            document.body.removeChild(textArea);
            setTimeout(() => btnCopy.innerText = "Copy", 2000);
        }

        // --- FIZIKAL SMOOTH DRAG & KLIK BUTANG ---
        let startY = 0;
        let currentY = 0;
        let isDragging = false;
        let isAnimating = false; 
        const SWIPE_THRESHOLD = 50; 

        // Navigasi Prev/Next hanya berfungsi di Tab Game
        const navigasiDiizinkan = () => {
            return gameContainer.style.display !== 'none' && !isAnimating;
        };

        btnPrev.onclick = (e) => {
            if (!navigasiDiizinkan()) return;
            isAnimating = true;
            wrapper.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)';
            wrapper.style.transform = `translateY(100%)`; 
            hideTutorial(); 
            setTimeout(() => anjakFrameKitaran(-1), 400);
        };

        btnNext.onclick = (e) => {
            if (!navigasiDiizinkan()) return;
            isAnimating = true;
            wrapper.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)';
            wrapper.style.transform = `translateY(-100%)`; 
            hideTutorial(); 
            setTimeout(() => anjakFrameKitaran(1), 400);
        };

        function handleTouchStart(e) {
            if (!navigasiDiizinkan()) return;
            startY = e.touches[0].clientY;
            currentY = startY;
            isDragging = true;
            wrapper.style.transition = 'none';
        }

        function handleTouchMove(e) {
            if (!isDragging || !navigasiDiizinkan()) return;
            e.preventDefault(); 
            currentY = e.touches[0].clientY;
            const diffY = currentY - startY;
            wrapper.style.transform = `translateY(${diffY}px)`;
        }

        function handleTouchEnd(e) {
            if (!isDragging || !navigasiDiizinkan()) return;
            isDragging = false;
            const diffY = currentY - startY;

            if (Math.abs(diffY) < 10) return;

            if (diffY < -SWIPE_THRESHOLD) {
                isAnimating = true;
                wrapper.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)';
                wrapper.style.transform = `translateY(-100%)`;
                hideTutorial(); 
                setTimeout(() => anjakFrameKitaran(1), 400); 
            } 
            else if (diffY > SWIPE_THRESHOLD) {
                isAnimating = true;
                wrapper.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)';
                wrapper.style.transform = `translateY(100%)`;
                hideTutorial(); 
                setTimeout(() => anjakFrameKitaran(-1), 400);
            } 
            else {
                wrapper.style.transition = 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)';
                wrapper.style.transform = `translateY(0)`;
            }
        }

        // Swipe hanya berfungsi di Nav Bawah dan Extension
        [bottomNav, swipeExt].forEach(el => {
            el.addEventListener('touchstart', handleTouchStart);
            el.addEventListener('touchmove', handleTouchMove, { passive: false });
            el.addEventListener('touchend', handleTouchEnd);
        });

        function anjakFrameKitaran(dir) {
            const total = games.length;
            
            wrapper.style.transition = 'none';
            wrapper.style.transform = `translateY(0)`;

            if (dir > 0) {
                index = (index + 1) % total;
                let tempPrev = frames.prev;
                frames.prev = frames.curr;
                frames.curr = frames.next;
                frames.next = tempPrev;
                frames.next.src = games[(index + 1) % total].url;
            } 
            else {
                index = (index - 1 + total) % total;
                let tempNext = frames.next;
                frames.next = frames.curr;
                frames.curr = frames.prev;
                frames.prev = tempNext;
                frames.prev.src = games[(index - 1 + total) % total].url;
            }

            localStorage.setItem('cozyLastGameIndex', index.toString());

            frames.prev.style.top = '-100%';
            frames.curr.style.top = '0%';
            frames.next.style.top = '100%';

            updateHeaderUI();
            isAnimating = false; 

            if (adPhase === 1) {
                adSwipeCount++;
                if (adSwipeCount >= 3) {
                    showUnityAds(); 
                    adPhase = 2; 
                    startAdTimer(); 
                }
            } else if (adPhase === 2) {
                if (timerFinished) {
                    adSwipeCount++;
                    if (adSwipeCount >= 3) {
                        showUnityAds(); 
                        startAdTimer(); 
                    }
                }
            }
        }

    </script>
</body>
</html>
