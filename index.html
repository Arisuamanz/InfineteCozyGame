<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cozy Infinite Games</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: #000; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* --- TOP HEADER --- */
        #top-header {
            height: 50px;
            background: #0f0f0f;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            color: white;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            user-select: none;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #4CAF50;
            border-radius: 50%;
        }

        #game-title {
            font-weight: bold;
            font-size: 16px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
            color: #888;
            font-size: 14px;
        }

        #refresh-btn {
            font-size: 20px;
            cursor: pointer;
            transition: color 0.2s;
        }
        
        #refresh-btn:active {
            color: #fff;
        }

        /* --- GAME CONTAINER --- */
        #game-container {
            flex: 1; 
            position: relative;
            overflow: hidden;
            background: #111;
        }

        /* Wrapper untuk menggerakkan 3 frame serentak */
        #frame-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            will-change: transform;
        }

        /* Kelas asas untuk iframe */
        .game-frame {
            position: absolute;
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block; 
            background: #111; 
        }

        /* --- KAWASAN SWIPE TAMBAHAN (Di atas Bottom UI) --- */
        #swipe-extension {
            position: absolute;
            bottom: 65px; 
            left: 0;
            width: 100%;
            height: 60px; 
            z-index: 15;
            touch-action: none;
        }

        /* --- TUTORIAL OVERLAY (First time user) --- */
        #tutorial-overlay {
            position: absolute;
            bottom: 135px; 
            width: 100%;
            display: none; 
            justify-content: center;
            z-index: 20;
            pointer-events: none; 
            animation: bounce 1.5s infinite;
        }

        .tut-box {
            background: rgba(0, 0, 0, 0.8);
            color: #00e5ff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #00e5ff;
            box-shadow: 0 4px 10px rgba(0, 229, 255, 0.3);
            text-align: center;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* --- AD LOADING SCREEN --- */
        #ad-loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999; 
            display: none; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            user-select: none;
        }

        .ad-box {
            background: #1a1a1a;
            padding: 30px 50px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid #00e5ff;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
        }

        .ad-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 229, 255, 0.2);
            border-top: 4px solid #00e5ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }

        .ad-box p {
            margin: 0;
            font-size: 16px;
            color: #ccc;
        }

        .ad-box h1 {
            margin: 10px 0 0 0;
            font-size: 48px;
            color: #00e5ff;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- BOTTOM UI NAVIGATION --- */
        #bottom-nav {
            height: 65px;
            background: #121212;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
            border-top: 1px solid #222;
            touch-action: none; 
            user-select: none;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 11px;
            gap: 4px;
            cursor: pointer;
            width: 25%;
        }

        .nav-item.active {
            color: #00e5ff;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
        }

    </style>
</head>
<body>

    <!-- Header Atas -->
    <div id="top-header">
        <div class="header-left">
            <div class="status-dot"></div>
            <span id="game-title">Loading...</span>
        </div>
        <div class="header-right">
            <span id="refresh-btn">↻</span>
        </div>
    </div>

    <!-- Ruang Main Game -->
    <div id="game-container">
        <!-- Pembungkus 3-Iframe untuk Preload -->
        <div id="frame-wrapper">
            <iframe class="game-frame" id="frame-prev" allowfullscreen></iframe>
            <iframe class="game-frame" id="frame-curr" allowfullscreen></iframe>
            <iframe class="game-frame" id="frame-next" allowfullscreen></iframe>
        </div>
    </div>

    <!-- Panel Loading Iklan (English) -->
    <div id="ad-loading-screen">
        <div class="ad-box">
            <div class="ad-spinner"></div>
            <p>Ad loading in...</p>
            <h1 id="ad-countdown">2</h1>
        </div>
    </div>

    <!-- Tutorial untuk pengguna kali pertama -->
    <div id="tutorial-overlay">
        <div class="tut-box">↕ Swipe up or down at the bottom here to change games</div>
    </div>

    <!-- Kawasan swipe yang lutsinar lebih tinggi sedikit masuk ke webview -->
    <div id="swipe-extension"></div>

    <!-- UI Bawah -->
    <nav id="bottom-nav">
        <div class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="6" width="20" height="12" rx="2" ry="2"></rect>
                <path d="M6 12h4"></path>
                <path d="M8 10v4"></path>
                <line x1="15" y1="13" x2="15.01" y2="13"></line>
                <line x1="18" y1="11" x2="18.01" y2="11"></line>
            </svg>
            <span>Game</span>
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            <span>All Games</span>
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span>Search</span>
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Profile</span>
        </div>
    </nav>

    <script>
        const games = [
            { title: "Cute Animal", url: "https://arisuamanz.github.io/CuteAnimal/" },
            { title: "Stack", url: "https://arisuamanz.github.io/Stack/" },
            { title: "Painting Circuit", url: "https://arisuamanz.github.io/Painting-circuit-/" },
            { title: "3D Run Surfer", url: "https://arisuamanz.github.io/3DRunsurfer/" },
            { title: "Tower Build", url: "https://arisuamanz.github.io/Towerbuild/" },
            { title: "Solar Smash", url: "https://arisuamanz.github.io/Solar-Smash/" },
            { title: "Light Down", url: "https://arisuamanz.github.io/Light-Down/" }
        ];

        let index = 0;
        
        // --- PEMBOLEHUBAH LOGIK IKLAN BARU ---
        let adPhase = 1; // Fasa 1: Pertama kali buka, Fasa 2: Fasa kira masa (Timer)
        let adSwipeCount = 0; // Kiraan swipe untuk iklan
        let timerFinished = false; // Status adakah 5 minit sudah habis

        const wrapper = document.getElementById('frame-wrapper');
        const bottomNav = document.getElementById('bottom-nav');
        const swipeExt = document.getElementById('swipe-extension');
        const tutorialOverlay = document.getElementById('tutorial-overlay');
        const titleEl = document.getElementById('game-title');
        const refreshBtn = document.getElementById('refresh-btn');

        // Elemen Loading Iklan
        const adLoadingScreen = document.getElementById('ad-loading-screen');
        const adCountdownEl = document.getElementById('ad-countdown');

        let frames = {
            prev: document.getElementById('frame-prev'),
            curr: document.getElementById('frame-curr'),
            next: document.getElementById('frame-next')
        };

        // --- SISTEM TUTORIAL LOCAL STORAGE ---
        function checkTutorial() {
            const hasSeenTutorial = localStorage.getItem('cozyGameTutorialCompleted');
            if (!hasSeenTutorial) {
                tutorialOverlay.style.display = 'flex';
            }
        }
        
        function hideTutorial() {
            if (tutorialOverlay.style.display !== 'none') {
                tutorialOverlay.style.display = 'none';
                localStorage.setItem('cozyGameTutorialCompleted', 'true');
            }
        }

        // --- FUNGSI IKLAN UNITY ---
        const showUnityAds = () => {
            const message = "ShowUnityAds";
            try {
                if (window.Unity && typeof window.Unity.call === "function") {
                    window.Unity.call(message); return;
                }
                if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.unityControl) {
                    window.webkit.messageHandlers.unityControl.postMessage(message); return;
                }
                if (window.location && typeof window.location.href === "string") {
                    window.location.href = `unity:${encodeURIComponent(message)}`; return;
                }
            } catch (error) { console.warn("Ralat pautan showUnityAds:", error); }
            console.log("Ad Signal: ShowUnityAds dipanggil dari web.");
        };

        // --- FUNGSI MULA MASA (5 MINIT) ---
        function startAdTimer() {
            timerFinished = false;
            adSwipeCount = 0; // Reset kiraan swipe sedia untuk kitaran baru
            console.log("Timer iklan 5 minit bermula...");
            
            // 5 Minit = 5 * 60 * 1000 milisaat = 300000 ms
            setTimeout(() => {
                timerFinished = true;
                console.log("5 minit telah tamat. Menunggu 3 kali swipe untuk tunjuk iklan...");
            }, 300000); 
        }

        // --- FUNGSI LOADING IKLAN ---
        function triggerAdWithLoading() {
            adLoadingScreen.style.display = 'flex';
            let count = 2;
            adCountdownEl.innerText = count;

            const interval = setInterval(() => {
                count--;
                if (count > 0) {
                    adCountdownEl.innerText = count;
                } else {
                    clearInterval(interval);
                    adLoadingScreen.style.display = 'none'; 
                    showUnityAds(); 
                }
            }, 1000); 
        }

        function updateHeaderUI() {
            titleEl.innerText = games[index].title;
        }

        window.onload = () => {
            // --- LOAD LAST GAME DARI LOCAL STORAGE ---
            const savedIndex = localStorage.getItem('cozyLastGameIndex');
            if (savedIndex !== null) {
                let parsedIndex = parseInt(savedIndex, 10);
                if (!isNaN(parsedIndex) && parsedIndex >= 0 && parsedIndex < games.length) {
                    index = parsedIndex;
                }
            }

            const total = games.length;
            
            frames.prev.style.top = '-100%';
            frames.curr.style.top = '0%';
            frames.next.style.top = '100%';

            frames.curr.src = games[index].url;
            frames.next.src = games[(index + 1) % total].url;
            frames.prev.src = games[(index - 1 + total) % total].url;

            updateHeaderUI();
            checkTutorial(); 
        };

        refreshBtn.onclick = () => {
            frames.curr.src = games[index].url; 
        };

        // --- FIZIKAL SMOOTH DRAG ---
        let startY = 0;
        let currentY = 0;
        let isDragging = false;
        let isAnimating = false; 
        const SWIPE_THRESHOLD = 50; 

        function handleTouchStart(e) {
            if (isAnimating) return;
            startY = e.touches[0].clientY;
            currentY = startY;
            isDragging = true;
            wrapper.style.transition = 'none';
        }

        function handleTouchMove(e) {
            if (!isDragging || isAnimating) return;
            e.preventDefault(); 
            currentY = e.touches[0].clientY;
            const diffY = currentY - startY;
            wrapper.style.transform = `translateY(${diffY}px)`;
        }

        function handleTouchEnd(e) {
            if (!isDragging || isAnimating) return;
            isDragging = false;
            const diffY = currentY - startY;

            if (diffY < -SWIPE_THRESHOLD) {
                isAnimating = true;
                wrapper.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)';
                wrapper.style.transform = `translateY(-100%)`;
                hideTutorial(); 
                setTimeout(() => anjakFrameKitaran(1), 400); 
            } 
            else if (diffY > SWIPE_THRESHOLD) {
                isAnimating = true;
                wrapper.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)';
                wrapper.style.transform = `translateY(100%)`;
                hideTutorial(); 
                setTimeout(() => anjakFrameKitaran(-1), 400);
            } 
            else {
                wrapper.style.transition = 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)';
                wrapper.style.transform = `translateY(0)`;
            }
        }

        [bottomNav, swipeExt].forEach(el => {
            el.addEventListener('touchstart', handleTouchStart);
            el.addEventListener('touchmove', handleTouchMove, { passive: false });
            el.addEventListener('touchend', handleTouchEnd);
        });

        function anjakFrameKitaran(dir) {
            const total = games.length;
            
            wrapper.style.transition = 'none';
            wrapper.style.transform = `translateY(0)`;

            if (dir > 0) {
                index = (index + 1) % total;
                let tempPrev = frames.prev;
                frames.prev = frames.curr;
                frames.curr = frames.next;
                frames.next = tempPrev;
                frames.next.src = games[(index + 1) % total].url;
            } 
            else {
                index = (index - 1 + total) % total;
                let tempNext = frames.next;
                frames.next = frames.curr;
                frames.curr = frames.prev;
                frames.prev = tempNext;
                frames.prev.src = games[(index - 1 + total) % total].url;
            }

            // --- SAVE LAST GAME KE LOCAL STORAGE ---
            localStorage.setItem('cozyLastGameIndex', index.toString());

            frames.prev.style.top = '-100%';
            frames.curr.style.top = '0%';
            frames.next.style.top = '100%';

            updateHeaderUI();
            isAnimating = false; 

            // --- LOGIK PANGGILAN IKLAN BERDASARKAN MASA & SWIPE ---
            if (adPhase === 1) {
                // Fasa 1: Pertama kali buka, tunggu 3 swipe
                adSwipeCount++;
                if (adSwipeCount >= 3) {
                    triggerAdWithLoading();
                    adPhase = 2; // Tukar ke fasa berulang (berdasarkan masa)
                    startAdTimer(); // Mula kira 5 minit
                }
            } else if (adPhase === 2) {
                // Fasa 2: Fasa masa. Jika masa 5 minit dah tamat, baru kira swipe
                if (timerFinished) {
                    adSwipeCount++;
                    if (adSwipeCount >= 3) {
                        triggerAdWithLoading();
                        startAdTimer(); // Reset masa 5 minit untuk kitaran seterusnya
                    }
                }
                // Jika masa belum tamat (timerFinished = false), pengguna boleh swipe bebas tanpa iklan
            }
        }

    </script>
</body>
</html>
